name: CI

on:
  workflow_call:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for embedded assets
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets before Go checks
        working-directory: frontend
        run: npm run build

      - name: Test frontend behavior and themes
        working-directory: frontend
        run: npm test

      - name: Install browser for UI regression tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test Svelte flows in Chromium
        working-directory: frontend
        run: npm run test:ui

      - name: Run Go tests
        run: go test ./...

      - name: Run all Go tests with the race detector
        run: go test -race ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Build Go packages
        run: go build ./...

  windows:
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.package-candidate.outputs.artifact-name }}
      product-version: ${{ steps.package-candidate.outputs.product-version }}
      zip-sha256: ${{ steps.package-candidate.outputs.zip-sha256 }}
      exe-sha256: ${{ steps.package-candidate.outputs.exe-sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend security helpers
        working-directory: frontend
        run: npm test

      - name: Test Go including Windows storage permissions and migration
        shell: pwsh
        run: |
          go test ./... 2>&1 | Tee-Object -Variable testOutput
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            # Keep individual failing tests visible in the PR checks summary,
            # including when access to the full Actions logs is unavailable.
            $failures = $testOutput | Select-String -Pattern '--- FAIL:|\s+\S+_test\.go:\d+:'
            $message = ($failures -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Go test failures::$message"
          }
          exit $testExit

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows desktop application
        run: wails build -platform windows/amd64

      - name: Check Windows executable
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'build/bin/password-saver.exe' -ErrorAction Stop
          if ($exe.PSIsContainer -or $exe.Length -eq 0) {
            throw 'Wails did not produce a nonempty password-saver.exe'
          }

      - name: Launch Windows executable with isolated test data
        shell: pwsh
        run: |
          $exe = (Get-Item -LiteralPath 'build/bin/password-saver.exe' -ErrorAction Stop).FullName
          $testData = Join-Path $env:RUNNER_TEMP 'passwordsaver-exe-smoke'
          New-Item -ItemType Directory -Path $testData -Force | Out-Null
          $env:LOCALAPPDATA = $testData
          $process = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "Windows executable exited during startup (code $($process.ExitCode))"
            }
            Write-Output 'Windows executable stayed running for 8 seconds with isolated test data.'
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Package and verify Windows candidate ZIP
        id: package-candidate
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'wails.json' -Raw | ConvertFrom-Json).info.productVersion
          $frontendVersion = (Get-Content -LiteralPath 'frontend/package.json' -Raw | ConvertFrom-Json).version
          $exe = (Get-Item -LiteralPath 'build/bin/password-saver.exe').FullName
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $fileVersion = '{0}.{1}.{2}.{3}' -f $info.FileMajorPart, $info.FileMinorPart, $info.FileBuildPart, $info.FilePrivatePart
          $productVersion = '{0}.{1}.{2}.{3}' -f $info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart, $info.ProductPrivatePart
          Write-Output "::notice title=Windows versions::Wails $version. Frontend $frontendVersion. EXE file $fileVersion. EXE product $productVersion."
          if ($version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$' -or $frontendVersion -cne $version -or
              $fileVersion -cne "$version.0" -or $productVersion -cne "$version.0") {
            throw 'Wails, frontend and Windows executable versions do not match'
          }
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checkout does not match the triggering commit' }
          $artifactName = "PasswordSaver-Standard-$version-Windows-x64"
          $root = [IO.Directory]::CreateTempSubdirectory('passwordsaver-candidate-').FullName
          $zipPath = Join-Path $root "$artifactName.zip"
          $readme = Join-Path $root 'README.txt'
          $checksums = Join-Path $root 'SHA256SUMS.txt'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"

          @"
          PasswordSaver Standard $version (Windows x64)

          Use only synthetic data in a dedicated Windows profile when testing this build.

          1. Extract the ZIP to a new folder.
          2. Open the PasswordSaver folder and run password-saver.exe.
          3. If Microsoft Edge WebView2 Runtime is missing, install the Evergreen
             Runtime from https://developer.microsoft.com/microsoft-edge/webview2/.
             Then launch password-saver.exe again.

          To verify the executable in PowerShell, run the following from its folder
          and compare the hash with SHA256SUMS.txt:
              Get-FileHash -Algorithm SHA256 .\password-saver.exe

          Commit: $env:GITHUB_SHA
          Source: $env:GITHUB_REF
          Run: $runUrl (attempt $env:GITHUB_RUN_ATTEMPT)
          "@ | Set-Content -LiteralPath $readme -Encoding utf8
          "$hash  password-saver.exe" | Set-Content -LiteralPath $checksums -Encoding ascii

          # Add only the build output and the two generated files.
          $files = [ordered]@{
            'PasswordSaver/password-saver.exe' = $exe
            'PasswordSaver/README.txt' = $readme
            'PasswordSaver/SHA256SUMS.txt' = $checksums
          }
          $zip = [IO.Compression.ZipFile]::Open($zipPath, 'Create')
          try {
            foreach ($entry in $files.GetEnumerator()) {
              [IO.Compression.ZipFileExtensions]::CreateEntryFromFile($zip, $entry.Value, $entry.Key) | Out-Null
            }
          } finally {
            $zip.Dispose()
          }

          $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($zip.Entries.FullName)
            if ($names.Count -ne $files.Count -or (Compare-Object @($files.Keys) $names -CaseSensitive)) {
              throw 'Candidate ZIP does not match the exact file allowlist'
            }
          } finally {
            $zip.Dispose()
          }

          $extracted = Join-Path $root 'verify'
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extracted
          $extractedHash = (Get-FileHash -LiteralPath (Join-Path $extracted 'PasswordSaver/password-saver.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = (Get-Content -LiteralPath (Join-Path $extracted 'PasswordSaver/SHA256SUMS.txt') -Raw).TrimEnd()
          if ($extractedHash -ne $hash -or $checksumLine -cne "$extractedHash  password-saver.exe") {
            throw 'Candidate ZIP executable checksum mismatch'
          }

          $zipHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = "$zipPath.sha256"
          [IO.File]::WriteAllText($manifest, "$zipHash  $artifactName.zip`n", [Text.Encoding]::ASCII)
          "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT
          "product-version=$version" >> $env:GITHUB_OUTPUT
          "zip-path=$zipPath" >> $env:GITHUB_OUTPUT
          "manifest-path=$manifest" >> $env:GITHUB_OUTPUT
          "zip-sha256=$zipHash" >> $env:GITHUB_OUTPUT
          "exe-sha256=$hash" >> $env:GITHUB_OUTPUT
          @"
          ### Windows x64 release candidate

          Sign in to GitHub and download **$artifactName** under **Artifacts** in the
          [run summary]($runUrl). Extract the outer download. Verify **$artifactName.zip**
          against **$artifactName.zip.sha256**, then unpack and open **PasswordSaver/README.txt**.
          Use a dedicated Windows test profile with synthetic data.

          Commit: $env:GITHUB_SHA · Source: $env:GITHUB_REF · Attempt: $env:GITHUB_RUN_ATTEMPT
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-candidate.outputs.artifact-name }}
          path: |
            ${{ steps.package-candidate.outputs.zip-path }}
            ${{ steps.package-candidate.outputs.manifest-path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-windows-preview:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the uploaded Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.artifact-name }}
          path: downloaded-candidate

      - name: Verify downloaded ZIP, EXE and provenance independently
        env:
          ARTIFACT_DIRECTORY: downloaded-candidate
          ARTIFACT_NAME: ${{ needs.windows.outputs.artifact-name }}
          PRODUCT_VERSION: ${{ needs.windows.outputs.product-version }}
          EXPECTED_ZIP_SHA256: ${{ needs.windows.outputs.zip-sha256 }}
          EXPECTED_EXE_SHA256: ${{ needs.windows.outputs.exe-sha256 }}
        run: python3 .github/scripts/verify_windows_candidate.py
