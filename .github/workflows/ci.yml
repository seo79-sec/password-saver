name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  go-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies for embedded assets
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets before Go checks
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run all Go tests with the race detector
        run: go test -race ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Build Go packages
        run: go build ./...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend security helpers
        working-directory: frontend
        run: npm test

      - name: Test Go including Windows storage permissions and migration
        shell: pwsh
        run: |
          go test ./... 2>&1 | Tee-Object -Variable testOutput
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            # Keep individual failing tests visible in the PR checks summary,
            # including when access to the full Actions logs is unavailable.
            $failures = $testOutput | Select-String -Pattern '--- FAIL:|\s+\S+_test\.go:\d+:'
            $message = ($failures -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Go test failures::$message"
          }
          exit $testExit

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows desktop application
        run: wails build -platform windows/amd64
