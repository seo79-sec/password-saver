name: Open selective import pull request

on:
  push:
    branches: [test/windows-external-backup-native]
    paths:
      - .github/workflows/open-external-import-pr.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  open-import-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: feature/v2-external-backup-verify-import
      HEAD_COMMIT: 9112d614ac6275e8f524754ebd00970504dc6333
    steps:
      - name: Request a PR from the GitHub REST API
        shell: bash
        run: |
          remote_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$HEAD_BRANCH" --jq .object.sha)"
          if [ "$remote_sha" != "$HEAD_COMMIT" ]; then
            echo '::error title=PR branch provenance::Feature branch does not match the reviewed commit.'
            exit 1
          fi
          existing="$(gh api --method GET "repos/$GH_REPO/pulls" -f base=main -f state=open -f head="${GH_REPO%/*}:$HEAD_BRANCH" --jq '.[0].html_url // empty')"
          if [ -n "$existing" ]; then
            echo "$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > "$RUNNER_TEMP/passwordsaver-import-pr.md" <<'BODY'
          ## Summary

          - Verify the format, AEAD and TOTP of an external v2 backup without writing any vault files. A native file picker runs before the credential prompt.
          - Preview titles, logins and duplicate matches. Import selected records after an explicit confirmation. Matches are skipped by default or added as separate records.
          - Recheck the verified source and the current vault revision before committing one encrypted revision. The destination retains its password, TOTP, settings and existing records.
          - A failure between backup and primary replacement can leave the encrypted backup equal to the old primary. If sync cannot be confirmed, re-open the vault and inspect the records before retrying.

          ## Verification

          Go regressions cover read-only verification, TOTP, expiry, cancellation, changed source files and injected write failures. Playwright exercises selection and stale responses with a mocked Wails bridge. [CI for the reviewed head](https://github.com/seo79-sec/password-saver/actions/runs/44784877548) tests on Linux and Windows, builds the Windows Wails application and checks the isolated process launch. [Native GUI verification](https://github.com/seo79-sec/password-saver/actions/runs/44785298827) exercises the same EXE with synthetic data.
          BODY
          jq -n --arg head "$HEAD_BRANCH" --rawfile body "$RUNNER_TEMP/passwordsaver-import-pr.md" \
            '{title:"PasswordSaver: verify encrypted backups and selectively import records",head:$head,base:"main",body:$body}' > "$RUNNER_TEMP/passwordsaver-import-pr.json"
          if url="$(gh api --method POST "repos/$GH_REPO/pulls" --input "$RUNNER_TEMP/passwordsaver-import-pr.json" --jq .html_url 2>"$RUNNER_TEMP/passwordsaver-pr-error")"; then
            echo "$url" >> "$GITHUB_STEP_SUMMARY"
          else
            detail="$(head -c 500 "$RUNNER_TEMP/passwordsaver-pr-error" | tr '\r\n' ' ')"
            printf '::error title=GitHub PR creation rejected::%s\n' "$detail"
            exit 1
          fi
