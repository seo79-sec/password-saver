name: Build Windows release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify embedded frontend assets
        shell: pwsh
        run: |
          if (-not (Test-Path -Path frontend/dist -PathType Container)) {
            throw "frontend/dist was not created by the frontend build"
          }
          if (-not (Test-Path -Path frontend/dist/index.html -PathType Leaf)) {
            throw "frontend/dist/index.html is missing"
          }

      - name: Test and build Go packages
        run: |
          go test ./...
          go build ./...

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build Windows application
        run: wails build -platform windows/amd64 -clean

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\build\bin\password-saver.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path .\build\bin\password-saver.exe.sha256 -Value "$hash  password-saver.exe" -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: password-saver-v1.1.0-windows-amd64
          path: |
            build/bin/password-saver.exe
            build/bin/password-saver.exe.sha256
          if-no-files-found: error
          retention-days: 14
