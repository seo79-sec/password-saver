name: Publish PasswordSaver Standard 2.0.0 draft

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: passwordsaver-v2.0.0-release
  cancel-in-progress: false

jobs:
  draft-release:
    if: github.ref == 'refs/heads/main' && github.repository == 'seo79-sec/password-saver'
    runs-on: windows-latest
    steps:
      - name: Check out exact main commit
        uses: actions/checkout@v4

      - name: Verify release identity and prevent replacement
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ("$env:GITHUB_REF" -ne "refs/heads/main") { throw "Only main may be released" }
          $config = Get-Content .\wails.json -Raw | ConvertFrom-Json
          if ($config.info.productVersion -ne "2.0.0") { throw "Unexpected productVersion" }
          gh release view v2.0.0 --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "v2.0.0 release already exists; do not replace its assets" }

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check embedded frontend
        shell: pwsh
        run: |
          if (-not (Test-Path frontend/dist/index.html)) { throw "Embedded frontend missing" }

      - name: Go tests and static checks
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Go tests failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "Go vet failed" }
          go build ./...
          if ($LASTEXITCODE -ne 0) { throw "Go build failed" }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build release binary
        run: wails build -platform windows/amd64 -clean

      - name: Package executable and SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'passwordsaver-v2.0.0'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item .\build\bin\password-saver.exe (Join-Path $root 'password-saver.exe')
          $exe = Join-Path $root 'password-saver.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path (Join-Path $root 'password-saver.exe.sha256') -Value "$hash  password-saver.exe" -NoNewline -Encoding ascii
          $zip = Join-Path $env:GITHUB_WORKSPACE 'PasswordSaver-Standard-2.0.0-Windows-x64.zip'
          Compress-Archive -Path $exe, (Join-Path $root 'password-saver.exe.sha256') -DestinationPath $zip
          $extracted = Join-Path $env:RUNNER_TEMP 'passwordsaver-verify'
          Expand-Archive -Path $zip -DestinationPath $extracted
          $zipHash = (Get-FileHash (Join-Path $extracted 'password-saver.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $zipHash) { throw "Package checksum mismatch" }
          Set-Content -Path "$zip.sha256" -Value "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $zip -Leaf)" -NoNewline -Encoding ascii
          if ((Get-ChildItem $extracted -File).Count -ne 2) { throw "Unexpected files inside release archive" }

      - name: Create draft GitHub Release with release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @('.\PasswordSaver-Standard-2.0.0-Windows-x64.zip', '.\PasswordSaver-Standard-2.0.0-Windows-x64.zip.sha256')
          gh release create v2.0.0 @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "PasswordSaver Standard 2.0.0 - AES-256-GCM" --notes-file .\docs\RELEASE_NOTES_V2.0.0.md --draft
          if ($LASTEXITCODE -ne 0) { throw "Could not create draft release" }

      - name: Record release provenance
        shell: pwsh
        run: |
          Write-Host "Draft v2.0.0 created from commit $env:GITHUB_SHA"
          Write-Host "Check release assets and manual Windows acceptance before publication."
